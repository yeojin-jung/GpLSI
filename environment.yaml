name: gplsi-env
channels:
  - conda-forge
dependencies:
  # Core
  - python=3.11
  - numpy
  - pandas
  - scipy>=1.9
  - scikit-learn
  - matplotlib
  - seaborn
  - networkx
  - cvxpy
  - pytest
  - anndata        # Visium DLPFC
  - tqdm           # utils/spatial_lda
  - palettable

  # For graph-regularized backend 
  # scikit-sparse 0.5.0 removed cholesky_AAt, which pycvxcluster.algos.admm imports.
  - scikit-sparse>=0.4.12,<0.5
  - suitesparse

  # Optional: R TopicScore baseline in the legacy simulation runner
  - rpy2

  # Allow installing extras via pip
  - pip
  - pip:
      # Optional: install pycvxcluster directly from GitHub
      - pycvxcluster @ git+https://github.com/signal-lab-uchicago/pycvxcluster-0.1.0.git
